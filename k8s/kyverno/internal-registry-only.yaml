# K8S-02 (Chapter 8): only images from the internal registry are admitted,
# in every kind of container a pod can have. Kyverno ValidatingPolicy (CEL),
# which replaces the deprecated ClusterPolicy kind from Kyverno 1.17.
# Signature checks belong in an ImageValidatingPolicy alongside this one.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: internal-registry-only
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  validations:
    - message: "Images must come from registry.bank.example"
      expression: >-
        object.spec.containers.all(c, c.image.startsWith('registry.bank.example/')) &&
        object.spec.?initContainers.orValue([]).all(c, c.image.startsWith('registry.bank.example/')) &&
        object.spec.?ephemeralContainers.orValue([]).all(c, c.image.startsWith('registry.bank.example/'))
