# Chapter 8: every namespace carries owner, criticality and critical operation.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-namespace-owner
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [namespaces]
  validations:
    - message: "Namespaces need owner, criticality and critical-op labels"
      expression: >-
        has(object.metadata.labels) &&
        'owner' in object.metadata.labels &&
        'critical-op' in object.metadata.labels &&
        object.metadata.labels.?criticality.orValue('') in ['critical', 'high', 'medium', 'low']
